[project]
name = "signalforge-workspace"
version = "0.1.0"
description = "SignalForge - cloud-native detection & response platform (workspace root)"
requires-python = ">=3.9"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["libs/signalforge", "apps/api", "."]
addopts = "-ra --strict-markers"
markers = [
    "detections: detection-as-code rule tests (positive/negative/false-positive)",
    "integration: cross-component tests using the in-process backends",
    "e2e: end-to-end tests through the FastAPI application",
    "load: throughput and latency benchmarks (skipped unless SIGNALFORGE_RUN_LOAD=1)",
    "slow: takes more than a couple of seconds",
]
filterwarnings = [
    "error::DeprecationWarning:signalforge.*",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["libs/signalforge/signalforge", "apps/api/app"]
branch = true
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
# The library declares requires-python = ">=3.9", so ruff must not rewrite
# anything into 3.10+/3.11+ syntax (e.g. datetime.UTC, X | None at runtime).
target-version = "py39"
exclude = [".venv", "apps/dashboard", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP006",  # keep typing.List/Dict - the library supports Python 3.9
    "UP007",  # keep Optional[X] for the same reason
    # UP045 rewrites Optional[X] to `X | None`, which ruff considers safe
    # because `from __future__ import annotations` defers evaluation. It is
    # not safe here: pydantic and FastAPI *do* evaluate annotations at
    # runtime, and PEP 604 unions raise TypeError on Python 3.9.
    "UP045",
    "UP035",
    "UP031",  # %-formatting is the house style here, used consistently
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["apps/dashboard", "\\.venv"]
