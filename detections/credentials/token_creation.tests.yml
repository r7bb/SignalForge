rule: sf-cred-0001
tests:
  - name: cloud access key creation fires
    kind: positive
    expect: alert
    expect_min_risk: 50
    events:
      - source: aws.cloudtrail
        payload:
          eventName: CreateAccessKey
          eventSource: iam.amazonaws.com
          awsRegion: us-east-1
          sourceIPAddress: 10.0.4.82
          userAgent: aws-cli/2.15.0
          userIdentity: {type: IAMUser, userName: alex, accountId: "123456789012"}
          requestParameters: {userName: alex}
          responseElements: {accessKey: {accessKeyId: AKIAEXAMPLE}}
          eventID: e-key-1
          readOnly: false

  - name: application api key creation fires
    kind: positive
    expect: alert
    events:
      - source: app.audit
        payload:
          action: api_key_created
          user: alex@example.com
          ip: 10.0.4.82
          session_id: s-77
          token_id: tok_9
          resource: api-keys
          resource_criticality: high
          status_code: 201

  - name: identity provider api token creation fires
    kind: positive
    expect: alert
    events:
      - source: okta.system
        payload:
          eventType: system.api_token.create
          outcome: {result: SUCCESS}
          actor: {alternateId: alex@example.com, id: a1, type: User}
          target: [{type: ApiToken, displayName: automation-token, id: t1}]

  - name: token revocation does not fire
    kind: negative
    expect: no_alert
    events:
      - source: app.audit
        payload:
          action: api_key_revoked
          user: alex@example.com
          token_id: tok_9

  - name: failed key creation does not fire
    kind: negative
    expect: no_alert
    events:
      - source: aws.cloudtrail
        payload:
          eventName: CreateAccessKey
          eventSource: iam.amazonaws.com
          sourceIPAddress: 10.0.4.82
          userIdentity: {type: IAMUser, userName: alex}
          requestParameters: {userName: alex}
          errorCode: AccessDenied
          errorMessage: User is not authorized to perform iam:CreateAccessKey
          eventID: e-key-2

  - name: ordinary password change does not fire
    kind: negative
    expect: no_alert
    events:
      - source: app.audit
        payload:
          action: password_change
          user: alex@example.com

  - name: CI pipeline key rotation is filtered
    kind: false_positive
    expect: no_alert
    events:
      - source: aws.cloudtrail
        payload:
          eventName: CreateAccessKey
          eventSource: iam.amazonaws.com
          sourceIPAddress: 10.0.0.30
          userIdentity: {type: IAMUser, userName: ci-deploy, accountId: "123456789012"}
          requestParameters: {userName: ci-deploy}
          responseElements: {accessKey: {accessKeyId: AKIACIDEPLOY}}
          eventID: e-key-3
          readOnly: false
