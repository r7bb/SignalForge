title: New Access Credential Created
id: sf-cred-0001
name: credential_created
status: test
description: |
  A long-lived credential was created: an IAM access key, an API token or a
  console login profile. Attackers do this immediately after gaining access so
  they keep it after the password is rotated.
author: SignalForge
date: 2026/04/15
references:
  - https://attack.mitre.org/techniques/T1098/001/
logsource:
  category: iam
detection:
  selection_account_change:
    class_uid: 3001
    activity_id: 1
    status: Success
  credential_cloud_key:
    api.operation:
      - CreateAccessKey
      - CreateLoginProfile
      - CreateServiceSpecificCredential
  credential_app_token:
    unmapped.action:
      - api_key_created
      - service_token_created
  credential_idp_token:
    unmapped.eventType: system.api_token.create
  credential_key_resource:
    resources.type|contains: AccessKey
  filter_automation:
    actor.user.type: Service
  condition: selection_account_change and 1 of credential_* and not filter_automation
fields:
  - actor.user.name
  - api.operation
  - unmapped.token_id
falsepositives:
  - Key rotation performed by a platform engineer or CI pipeline
  - Onboarding automation issuing a first API token
level: high
tags:
  - attack.persistence
  - attack.t1098
  - attack.t1098.001
signalforge:
  confidence: 8
  response_playbook: revoke_api_token
