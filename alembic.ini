# Alembic configuration for the SignalForge metadata database.
#
# The database URL is deliberately NOT set here: migrations/env.py resolves it
# from the same Settings object the services use, so `alembic upgrade head` and
# the running API can never disagree about which database they mean. Override
# for a one-off run with:
#
#     alembic -x url=postgresql+psycopg://... upgrade head

[alembic]
script_location = migrations
prepend_sys_path = libs/signalforge
path_separator = os
# Timestamped, sortable revision filenames: 0003_20260913_add_x.py
file_template = %%(rev)s_%%(year)d%%(month).2d%%(day).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
