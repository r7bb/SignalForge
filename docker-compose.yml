# SignalForge - full local stack.
#
#   docker compose up -d --build            # everything
#   docker compose up -d api dashboard      # API + UI against in-process backends
#   docker compose --profile observability up -d   # + Prometheus/Grafana
#
# The API and workers read the same SIGNALFORGE_* settings (see .env.example).

name: signalforge

x-python-env: &python-env
  SIGNALFORGE_ENVIRONMENT: docker
  SIGNALFORGE_LOG_LEVEL: INFO
  SIGNALFORGE_BUS_BACKEND: kafka
  SIGNALFORGE_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  SIGNALFORGE_EVENT_STORE_BACKEND: opensearch
  SIGNALFORGE_OPENSEARCH_URL: http://opensearch:9200
  SIGNALFORGE_DATABASE_URL: postgresql+psycopg://signalforge:signalforge@postgres:5432/signalforge
  SIGNALFORGE_REDIS_URL: redis://redis:6379/0
  SIGNALFORGE_CELERY_BROKER_URL: redis://redis:6379/1
  SIGNALFORGE_CELERY_RESULT_BACKEND: redis://redis:6379/2
  SIGNALFORGE_DETECTIONS_PATH: /app/detections
  SIGNALFORGE_INTEL_FEED_PATH: /app/schemas/intel/static_feed.json
  SIGNALFORGE_JWT_SECRET: ${SIGNALFORGE_JWT_SECRET:-dev-only-change-me}
  SIGNALFORGE_BOOTSTRAP_TENANT: ${SIGNALFORGE_BOOTSTRAP_TENANT:-acme}
  SIGNALFORGE_BOOTSTRAP_ADMIN_EMAIL: ${SIGNALFORGE_BOOTSTRAP_ADMIN_EMAIL:-admin@signalforge.local}
  SIGNALFORGE_BOOTSTRAP_ADMIN_PASSWORD: ${SIGNALFORGE_BOOTSTRAP_ADMIN_PASSWORD:-signalforge}
  SIGNALFORGE_RESPONSE_DRY_RUN: ${SIGNALFORGE_RESPONSE_DRY_RUN:-true}
  SIGNALFORGE_RESPONSE_REQUIRE_APPROVAL: "true"
  SIGNALFORGE_OTEL_ENABLED: ${SIGNALFORGE_OTEL_ENABLED:-false}
  SIGNALFORGE_OTEL_EXPORTER_ENDPOINT: http://otel-collector:4318/v1/traces

services:
  # ------------------------------------------------------------ infrastructure
  redpanda:
    image: redpandadata/redpanda:v24.2.8
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --check=false
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    profiles: ["observability"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
      POSTGRES_DB: signalforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data

  # -------------------------------------------------------------- application
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      <<: *python-env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health/live')\""]
      interval: 15s
      timeout: 5s
      retries: 8
    volumes:
      - ./detections:/app/detections:ro
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    environment:
      SIGNALFORGE_API_BASE: http://api:8000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      api: { condition: service_started }

  collector:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: ["python", "-m", "services.collector.main"]
    environment:
      <<: *python-env
      SIGNALFORGE_COLLECTOR_MODE: ${SIGNALFORGE_COLLECTOR_MODE:-lab}
      SIGNALFORGE_COLLECTOR_RATE: ${SIGNALFORGE_COLLECTOR_RATE:-20}
      SIGNALFORGE_COLLECTOR_TENANT: ${SIGNALFORGE_BOOTSTRAP_TENANT:-acme}
    depends_on:
      redpanda: { condition: service_healthy }
    volumes:
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  normalizer:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: ["python", "-m", "services.normalizer.main"]
    environment:
      <<: *python-env
    depends_on:
      redpanda: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    deploy:
      replicas: 2
    volumes:
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  detector:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: ["python", "-m", "services.detector.main"]
    environment:
      <<: *python-env
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./detections:/app/detections:ro
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  correlator:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: ["python", "-m", "services.correlator.main"]
    environment:
      <<: *python-env
    depends_on:
      redpanda: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./detections:/app/detections:ro
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  enricher:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command: ["python", "-m", "services.enricher.main"]
    environment:
      <<: *python-env
    depends_on:
      redpanda: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    command:
      ["celery", "-A", "services.worker.tasks", "worker", "--beat", "--loglevel=info",
       "--concurrency=2"]
    environment:
      <<: *python-env
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      - ./detections:/app/detections:ro
      - ./schemas:/app/schemas:ro
      - sf-var:/app/var

  vector:
    image: timberio/vector:0.42.0-alpine
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      SIGNALFORGE_TENANT: ${SIGNALFORGE_BOOTSTRAP_TENANT:-acme}
    volumes:
      - ./infrastructure/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/log:/host/var/log:ro
    depends_on:
      redpanda: { condition: service_healthy }
    profiles: ["collection"]

  # ------------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-signalforge}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["observability"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config", "/etc/otel/config.yaml"]
    volumes:
      - ./infrastructure/docker/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4318:4318"
    profiles: ["observability"]

volumes:
  redpanda-data:
  opensearch-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  sf-var:
