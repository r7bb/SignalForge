[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge"
version = "0.1.0"
description = "SignalForge core: OCSF normalization, Sigma detection, correlation and incident management"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "opensearch-py>=2.6",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
stream = ["aiokafka>=0.10"]
worker = ["celery>=5.4"]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pysigma>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["signalforge*"]

[tool.setuptools.package-data]
signalforge = ["py.typed"]
