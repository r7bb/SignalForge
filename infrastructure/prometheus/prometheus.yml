global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    platform: signalforge

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: signalforge-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels: { component: api }

  - job_name: signalforge-normalizer
    static_configs:
      - targets: ["normalizer:9464"]
        labels: { component: normalizer }

  - job_name: signalforge-detector
    static_configs:
      - targets: ["detector:9465"]
        labels: { component: detector }

  - job_name: signalforge-correlator
    static_configs:
      - targets: ["correlator:9466"]
        labels: { component: correlator }

  - job_name: signalforge-enricher
    static_configs:
      - targets: ["enricher:9467"]
        labels: { component: enricher }

  - job_name: signalforge-collector
    static_configs:
      - targets: ["collector:9468"]
        labels: { component: collector }

  - job_name: vector
    static_configs:
      - targets: ["vector:9598"]
        labels: { component: collection }
